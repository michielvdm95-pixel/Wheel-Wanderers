<style>
    :root {
        --lime: #98ff00; /* Vibrant Lime Green */
        --dark: #121212;
        --light-bg: #f9f9f9;
        --white: #ffffff;
    }

    body { font-family: 'Inter', sans-serif; margin: 0; background: var(--white); color: var(--dark); line-height: 1.6; }

    /* UNIFIED NAVIGATION */
    nav { 
        background: var(--white); 
        padding: 20px 5%; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        border-bottom: 1px solid #eee; 
        position: sticky; 
        top: 0; 
        z-index: 1000; 
    }
    .logo { font-weight: 800; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
    .logo span { color: var(--lime); }
    nav a { color: var(--dark); text-decoration: none; margin-left: 20px; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; transition: 0.2s; }
    nav a:hover { color: var(--lime); }

    /* SECTION HEADERS (Tomata Style) */
    .section-header { 
        background: var(--light-bg); 
        padding: 50px 10%; 
        border-left: 10px solid var(--lime); 
        margin: 20px 0; 
    }
    .section-header h1, .section-header h2 { margin: 0; text-transform: uppercase; letter-spacing: 2px; }

    /* THE GRID SYSTEM (For Bikes & Services) */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 40px 10%; }
    .card { border: 1px solid #eee; background: var(--white); transition: 0.3s; }
    .card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: auto; display: block; }
    .card-content { padding: 25px; }
    .card-price { color: var(--lime); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }

    /* LIME BUTTONS */
    .btn { 
        display: block; width: 100%; background: var(--lime); color: var(--dark); 
        text-align: center; padding: 15px 0; text-decoration: none; 
        font-weight: 800; text-transform: uppercase; font-size: 0.9rem; 
    }
    .btn:hover { filter: brightness(1.1); }

    footer { background: var(--dark); color: white; text-align: center; padding: 40px; margin-top: 60px; }
</style>
